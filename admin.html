<!DOCTYPE html>
<html lang="ru">
<head>

        .legend {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            flex-wrap: wrap;
            font-size: 0.7rem;

        }
        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend .dot {
            display: inline-block;

        .legend .dot.low {

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 99999;

    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="admin-header">
            <h1>🔧 PANA <span>KOLSAY</span> · Админ-панель</h1>
            <a href="index.html" class="back-link">← Вернуться на сайт</a>
        </div>

        <div class="admin-panel">
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchTab('excel')" id="tabExcel">📊 Загрузка Excel</button>
                <button class="admin-tab" onclick="switchTab('availability')" id="tabAvail">📅 Доступность</button>
                <button class="admin-tab" onclick="switchTab('bookings')" id="tabBookings">📋 Бронирования</button>
            </div>

            <div id="adminContent"></div>

            <div class="admin-actions" style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">
                <button class="admin-btn admin-btn-primary" onclick="saveAllData()">💾 Сохранить в облако</button>
                <span style="color:rgba(255,255,255,0.3);font-size:0.7rem;display:flex;align-items:center;">* Изменения сохраняются в облако</span>
            </div>
        </div>
    </div>

    <script>
        // ============ НАСТРОЙКИ ============
        const BIN_ID = '6a6c8c0eda38895dfea84fad';
        const API_KEY = '$2a$10$AxIfA8p7dq6td0BYtWWuhecnyqCJbsTGoo.oWIds3H01C43GvLGuu';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // МАППИНГ типов номеров из Excel -> ID в системе
        const ROOM_TYPE_MAPPING = {
            'Каменный домик': 'lux-a01',
            'Деревянный домик': 'lux-a02',
            'Standard Room': 'standard',
            'Стандарт без вида': 'standard',
            'Eco House': 'standard',
            'Superior Mountain view': 'mountain',
            'Superior Lake view': 'lake-twin',
            'Superior Lake view, triple': 'triple',
            'Deluxe': 'deluxe',
            'Deluxe +': 'deluxe-plus',
            'Premier Deluxe': 'premier-deluxe',
            'Suite Room': 'suite',
            'Glamping Domes +': 'glamping',
            'Glamping Domes': 'glamping'
        };

        // Базовые номера
        const ROOMS = [
            { id: 'standard', total: 4, nameRu: '🏨 Standard Room' },
            { id: 'mountain', total: 2, nameRu: '⛰ Mountain View' },
            { id: 'lake-double', total: 1, nameRu: '🌅 Lake View Double' },
            { id: 'lake-twin', total: 7, nameRu: '🌅 Lake View Twin' },
            { id: 'triple', total: 2, nameRu: '🌅 Lake View Triple' },
            { id: 'deluxe', total: 1, nameRu: '🏨 Deluxe' },
            { id: 'deluxe-plus', total: 2, nameRu: '🏡 Deluxe+' },
            { id: 'premier-deluxe', total: 1, nameRu: '🏡 Premier Deluxe' },
            { id: 'suite', total: 1, nameRu: '👑 Suite Room' },
            { id: 'lux-a02', total: 1, nameRu: '💎 Люкс A02' },
            { id: 'lux-a01', total: 1, nameRu: '💎 Люкс A01' },
            { id: 'glamping', total: 4, nameRu: '🏕️ Glamping' }
        ];

        let avails = {};
        let bookings = [];
        let currentTab = 'excel';
        let adminDateOffset = 0;
        let uploadedBookingsData = null;

        function rName(room) {
            return room['nameRu'] || room.nameRu;
        }

        function showToast(msg, type) {
            type = type || 'success';
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var el = document.createElement('div');
            el.className = 'toast';
            if (type === 'error') el.className += ' toast-error';
            if (type === 'info') el.className += ' toast-info';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s';
                setTimeout(function() { el.remove(); }, 300);
            }, 3000);
        }

        async function loadFromCloud() {
            try {
                var r = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                if (r.ok) {
                    var j = await r.json();
                    avails = j.record.avails || {};
                    bookings = j.record.bookings || [];
                }
            } catch (e) {
                var s = localStorage.getItem('pkb_backup');
                if (s) {
                    var j = JSON.parse(s);
                    avails = j.avails || {};
                    bookings = j.bookings || [];
                }
            }
        }

        async function saveToCloud() {
            var d = { avails: avails, bookings: bookings, ts: new Date().toISOString() };
            try {
                await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(d)
                });
                showToast('✅ Сохранено в облако!');
            } catch (e) {
                localStorage.setItem('pkb_backup', JSON.stringify(d));
                showToast('⚠️ Сохранено локально', 'info');
            }
        }

        function getAvail(rid, date) {
            if (avails[rid] && avails[rid][date] !== undefined) return avails[rid][date];
            var room = ROOMS.find(function(r) { return r.id === rid; });
            return room ? room.total : 0;
        }

        function setAvail(rid, date, n) {
            if (!avails[rid]) avails[rid] = {};
            var room = ROOMS.find(function(r) { return r.id === rid; });
            var max = room ? room.total : 0;
            avails[rid][date] = Math.max(0, Math.min(n, max));
        }

        function bookedCount(rid, date) {
            var count = 0;
            bookings.forEach(function(b) {
                if (b.rid === rid && b.date === date && b.st === 'ok') count++;
            });
            return count;
        }

        function realAvail(rid, date) {
            return Math.max(0, getAvail(rid, date) - bookedCount(rid, date));
        }

        async function saveAllData() {
            await saveToCloud();
        }

        function switchTab(tab) {
            currentTab = tab;
            var tabs = document.querySelectorAll('.admin-tab');
            tabs.forEach(function(b) { b.classList.remove('active'); });
            var target = document.querySelector('.admin-tab[onclick*="' + tab + '"]');
            if (target) target.classList.add('active');
            renderAdmin();
        }

        // ===== ЗАГРУЗКА EXCEL =====
        function handleBookingsFile(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var sheet = workbook.Sheets[workbook.SheetNames[0]];
                    uploadedBookingsData = XLSX.utils.sheet_to_json(sheet);
                    var headers = Object.keys(uploadedBookingsData[0] || {});
                    console.log('📋 Найдены колонки:', headers.join(', '));
                    document.getElementById('fileNameBookings').textContent = '✅ ' + file.name + ' (' + uploadedBookingsData
                        .length + ' записей)';
                    showToast('📥 Загружен файл: ' + uploadedBookingsData.length + ' записей', 'info');

                    // Показываем первую запись для отладки
                    console.log('📋 Первая запись:', uploadedBookingsData[0]);
                } catch (err) {
                    showToast('❌ Ошибка чтения файла: ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function setProgress(text, percent) {
            var prog = document.getElementById('adminProgress');
            prog.classList.add('show');
            document.getElementById('progressText').textContent = text;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function setStatus(message, type) {
            var el = document.getElementById('adminStatus');
            el.textContent = message;
            el.className = 'admin-status ' + type;
        }

        function clearStatus() {
            var el = document.getElementById('adminStatus');
            el.className = 'admin-status';
            el.textContent = '';
        }

        // ===== ОСНОВНАЯ ЛОГИКА ОБРАБОТКИ EXCEL =====
        async function processExcelFiles() {
            if (!uploadedBookingsData) {
                setStatus('❌ Сначала загрузите bookings.xlsx', 'error');
                return;
            }

            setProgress('Начинаем обработку...', 10);

            try {
                // 1. Определяем колонки
                var headers = Object.keys(uploadedBookingsData[0] || {});
                console.log('📋 Все колонки:', headers);

                // Ищем колонку "Категория номера" (или похожие названия)
                var typeCol = null;
                var checkInCol = null;
                var checkOutCol = null;

                // Поиск колонки с типом номера
                var typeKeywords = ['категория', 'тип', 'room', 'номер', 'категор'];
                for (var i = 0; i < headers.length; i++) {
                    var h = headers[i].toLowerCase();
                    for (var j = 0; j < typeKeywords.length; j++) {
                        if (h.indexOf(typeKeywords[j]) !== -1) {
                            typeCol = headers[i];
                            break;
                        }
                    }
                    if (typeCol) break;
                }

                // Поиск колонки с датой заезда
                var checkInKeywords = ['заезд', 'check-in', 'checkin', 'заезда'];
                for (var i = 0; i < headers.length; i++) {
                    var h = headers[i].toLowerCase();
                    for (var j = 0; j < checkInKeywords.length; j++) {
                        if (h.indexOf(checkInKeywords[j]) !== -1) {
                            checkInCol = headers[i];
                            break;
                        }
                    }
                    if (checkInCol) break;
                }

                // Поиск колонки с датой выезда
                var checkOutKeywords = ['выезд', 'check-out', 'checkout', 'выезда'];
                for (var i = 0; i < headers.length; i++) {
                    var h = headers[i].toLowerCase();
                    for (var j = 0; j < checkOutKeywords.length; j++) {
                        if (h.indexOf(checkOutKeywords[j]) !== -1) {
                            checkOutCol = headers[i];
                            break;
                        }
                    }
                    if (checkOutCol) break;
                }

                console.log('🔍 Найдено:', { typeCol: typeCol, checkInCol: checkInCol, checkOutCol: checkOutCol });

                if (!typeCol || !checkInCol || !checkOutCol) {
                    setStatus('❌ Не найдены колонки. Доступны: ' + headers.join(', '), 'error');
                    setProgress('Ошибка', 100);
                    return;
                }

                setProgress('Обработка броней...', 30);

                // 2. Собираем все брони
                var allBookings = [];

                uploadedBookingsData.forEach(function(row) {
                    // Получаем тип номера
                    var rawTypes = String(row[typeCol] || '');

                    // Разбиваем на несколько типов (если есть переносы строк или нумерация)
                    var types = rawTypes.split(/\n|\.\s*|\d+\./).map(function(s) { return s.trim(); }).filter(function(
                    s) { return s; });

                    // Если после разбивки ничего не получилось, используем всю строку
                    if (types.length === 0 && rawTypes.trim()) {
                        types = [rawTypes.trim()];
                    }

                    // Парсим даты
                    var checkIn, checkOut;

                    // Пробуем разные форматы дат
                    if (typeof row[checkInCol] === 'number') {
                        // Excel число -> дата (Excel даты это число дней с 1900-01-01)
                        checkIn = new Date((row[checkInCol] - 25569) * 86400 * 1000);
                    } else if (typeof row[checkInCol] === 'string' && row[checkInCol].indexOf('/') !== -1) {
                        var parts = row[checkInCol].split('/');
                        if (parts.length === 3) {
                            // Формат MM/DD/YYYY или DD/MM/YYYY
                            checkIn = new Date(parts[2], parts[0] - 1, parts[1]);
                            if (isNaN(checkIn.getTime())) {
                                checkIn = new Date(parts[2], parts[1] - 1, parts[0]);
                            }
                        }
                    } else {
                        checkIn = new Date(row[checkInCol]);
                    }

                    if (typeof row[checkOutCol] === 'number') {
                        checkOut = new Date((row[checkOutCol] - 25569) * 86400 * 1000);
                    } else if (typeof row[checkOutCol] === 'string' && row[checkOutCol].indexOf('/') !== -1) {
                        var parts2 = row[checkOutCol].split('/');
                        if (parts2.length === 3) {
                            checkOut = new Date(parts2[2], parts2[0] - 1, parts2[1]);
                            if (isNaN(checkOut.getTime())) {
                                checkOut = new Date(parts2[2], parts2[1] - 1, parts2[0]);
                            }
                        }
                    } else {
                        checkOut = new Date(row[checkOutCol]);
                    }

                    if (isNaN(checkIn.getTime()) || isNaN(checkOut.getTime())) {
                        console.log('⚠️ Ошибка парсинга дат:', row[checkInCol], row[checkOutCol]);
                        return;
                    }

                    // Проверяем, что даты корректные
                    if (checkOut <= checkIn) {
                        console.log('⚠️ Даты некорректны (выезд <= заезд):', checkIn, checkOut);
                        return;
                    }

                    types.forEach(function(type) {
                        if (type && type.length > 1) {
                            allBookings.push({
                                type: type.trim(),
                                checkIn: new Date(checkIn),
                                checkOut: new Date(checkOut)
                            });
                        }
                    });
                });

                if (allBookings.length === 0) {
                    setStatus('❌ Не найдено ни одной корректной брони. Проверьте формат данных.', 'error');
                    setProgress('Ошибка', 100);
                    return;
                }

                setProgress('Обработано ' + allBookings.length + ' броней...', 50);

                // 3. Строим календарь занятости
                var minDate = new Date(Math.min.apply(null, allBookings.map(function(b) { return b.checkIn.getTime(); })));
                var maxDate = new Date(Math.max.apply(null, allBookings.map(function(b) { return b.checkOut.getTime(); })));
                var startDate = new Date(minDate);
                var endDate = new Date(maxDate);
                endDate.setDate(endDate.getDate() + 1);

                // Ограничиваем диапазон 365 днями
                var daysLimit = 365;
                var totalDays = Math.min(Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)), daysLimit);
                if (totalDays > daysLimit) {
                    endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + daysLimit);
                }

                // Считаем занятость по дням и типам
                var occupied = {};
                allBookings.forEach(function(booking) {
                    var type = booking.type;
                    var d = new Date(booking.checkIn);
                    while (d < booking.checkOut && d < endDate) {
                        var key = type + '|' + d.toISOString().split('T')[0];
                        occupied[key] = (occupied[key] || 0) + 1;
                        d.setDate(d.getDate() + 1);
                    }
                });

                setProgress('Обновление доступности...', 70);

                // 4. Обновляем avails
                var newAvails = {};

                // Количество номеров по типам (из ROOMS через маппинг)
                var roomTypeTotal = {};
                ROOMS.forEach(function(room) {
                    // Находим соответствующий тип в маппинге
                    for (var excelType in ROOM_TYPE_MAPPING) {
                        if (ROOM_TYPE_MAPPING[excelType] === room.id) {
                            roomTypeTotal[excelType] = room.total;
                        }
                    }
                });

                // Добавляем все возможные типы из маппинга
                for (var excelType in ROOM_TYPE_MAPPING) {
                    var rid = ROOM_TYPE_MAPPING[excelType];
                    var room = ROOMS.find(function(r) { return r.id === rid; });
                    if (room) {
                        roomTypeTotal[excelType] = room.total;
                    }
                }

                console.log('🏨 Типы номеров в системе:', Object.keys(roomTypeTotal));

                var d = new Date(startDate);
                var daysProcessed = 0;
                var totalDaysToProcess = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));

                // Получаем сегодняшнюю дату для закрытия прошедших дней
                var today = new Date();
                today.setHours(0, 0, 0, 0);

                while (d < endDate) {
                    var dateStr = d.toISOString().split('T')[0];
                    daysProcessed++;

                    for (var type in roomTypeTotal) {
                        if (roomTypeTotal.hasOwnProperty(type)) {
                            var total = roomTypeTotal[type];
                            var key = type + '|' + dateStr;
                            var busy = occupied[key] || 0;
                            var free = Math.max(0, total - busy);

                            var roomId = ROOM_TYPE_MAPPING[type];
                            if (roomId) {
                                if (!newAvails[roomId]) newAvails[roomId] = {};
                                var roomTotal = 0;
                                ROOMS.forEach(function(r) { if (r.id === roomId) roomTotal = r.total; });

                                // Если дата прошедшая - ставим 0
                                if (d < today) {
                                    newAvails[roomId][dateStr] = 0;
                                } else {
                                    newAvails[roomId][dateStr] = Math.min(free, roomTotal);
                                }
                            }
                        }
                    }

                    if (daysProcessed % 10 === 0) {
                        var progress = 70 + (daysProcessed / totalDaysToProcess) * 25;
                        setProgress('Обработка дат... ' + daysProcessed + '/' + totalDaysToProcess, Math.min(95,
                        progress));
                    }

                    d.setDate(d.getDate() + 1);
                }

                setProgress('Сохранение...', 95);

                // Сохраняем старые данные для типов, которых нет в новом файле
                for (var rid in avails) {
                    if (avails.hasOwnProperty(rid) && !newAvails[rid]) {
                        newAvails[rid] = avails[rid];
                    }
                }

                avails = newAvails;
                await saveToCloud();

                setProgress('Готово!', 100);
                var totalRooms = 0;
                for (var t in roomTypeTotal) { if (roomTypeTotal.hasOwnProperty(t)) totalRooms += roomTypeTotal[t]; }
                setStatus('✅ Доступность обновлена! Обработано ' + allBookings.length + ' броней, ' + totalDaysToProcess +
                    ' дней, ' + totalRooms + ' номеров. Прошедшие даты закрыты.', 'success');
                showToast('✅ Доступность успешно обновлена из Excel!', 'success');

                setTimeout(function() {
                    document.getElementById('adminProgress').classList.remove('show');
                    setProgress('', 0);
                }, 3000);

            } catch (err) {
                setStatus('❌ Ошибка: ' + err.message, 'error');
                setProgress('Ошибка', 100);
                console.error(err);
            }
        }

        function clearAllAvailability() {
            if (!confirm('Вы уверены, что хотите очистить всю доступность?')) return;
            avails = {};
            saveToCloud();
            renderAdmin();
            showToast('🗑️ Вся доступность очищена', 'info');
        }

        // ===== РЕНДЕР АДМИНКИ =====
        function renderAdmin() {
            var container = document.getElementById('adminContent');

            if (currentTab === 'excel') {
                container.innerHTML = `
                    <div class="admin-upload-area" id="dropZoneBookings" onclick="document.getElementById('fileInputBookings').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>📂 Перетащите <strong>bookings.xlsx</strong> сюда или нажмите для выбора</p>
                        <p style="font-size:0.75rem;color:rgba(255,255,255,0.3);margin-top:4px;">
                            🔍 Ищутся колонки: <strong>Категория номера</strong>, <strong>Заезд</strong>, <strong>Выезд</strong>
                        </p>
                        <p style="font-size:0.7rem;color:rgba(255,255,255,0.2);margin-top:2px;">
                            Поддерживаются форматы: .xlsx, .xls
                        </p>
                        <span class="file-name" id="fileNameBookings">Файл не выбран</span>
                        <input type="file" id="fileInputBookings" accept=".xlsx,.xls">
                    </div>

                    <div class="admin-progress" id="adminProgress">
                        <div class="admin-progress-text" id="progressText">Обработка...</div>
                        <div class="admin-progress-bar"><div class="fill" id="progressFill"></div></div>
                    </div>

                    <div class="admin-status" id="adminStatus"></div>

                    <div class="admin-actions" style="border-top:1px solid rgba(255,255,255,0.06);padding-top:16px;margin-top:8px;flex-wrap:wrap;">
                        <button class="admin-btn admin-btn-success" onclick="processExcelFiles()">📊 Обработать и обновить доступность</button>
                        <button class="admin-btn admin-btn-warning" onclick="closePastDates()">🔒 Закрыть прошедшие даты</button>
                        <button class="admin-btn admin-btn-danger" onclick="clearAllAvailability()">🗑️ Очистить всё</button>
                    </div>
                `;

                var dropZoneB = document.getElementById('dropZoneBookings');
                var inputB = document.getElementById('fileInputBookings');

                dropZoneB.addEventListener('dragover', function(e) { e.preventDefault();
                    this.classList.add('dragover'); });
                dropZoneB.addEventListener('dragleave', function(e) { e.preventDefault();
                    this.classList.remove('dragover'); });
                dropZoneB.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('dragover');
                    if (e.dataTransfer.files.length) {
                        handleBookingsFile(e.dataTransfer.files[0]);
                    }
                });
                inputB.addEventListener('change', function(e) {
                    if (this.files.length) {
                        handleBookingsFile(this.files[0]);
                    }
                });

                return;
            }

            if (currentTab === 'bookings') {
                if (!bookings.length) {
                    container.innerHTML =
                        '<p style="color:rgba(255,255,255,0.4);text-align:center;padding:40px;">📭 Нет активных броней</p>';
                    return;
                }
                var h = '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>Номер</th><th>Дата</th><th>Гость</th><th>Тел</th><th>Гостей</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>';
                bookings.sort(function(a, b) { return new Date(b.at) - new Date(a.at); });
                bookings.forEach(function(b) {
                    h += '<tr><td>' + b.id + '</td><td>' + b.rname + '</td><td>' + b.date + '</td><td>' + b
                        .gname + '</td><td>' + b.phone + '</td><td>' + b.guests + '</td><td>' + b.total
                        .toLocaleString() + ' ₸</td><td>' + (b.st === 'ok' ? '✅ Активно' : '❌ Отменено') +
                        '</td></tr>';
                });
                h += '</tbody></table></div>';
                container.innerHTML = h;
                return;
            }

            // ===== ВКЛАДКА ДОСТУПНОСТЬ =====
            var now = new Date();
            var baseDate = new Date(now);
            baseDate.setDate(baseDate.getDate() + adminDateOffset * 30);

            var startOfMonth = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
            var endOfMonth = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0);

            var days = [];
            var d = new Date(startOfMonth);
            while (d <= endOfMonth) {
                days.push(new Date(d));
                d.setDate(d.getDate() + 1);
            }

            var monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь',
                'Ноябрь', 'Декабрь'
            ];
            var weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

            var today = new Date();
            today.setHours(0, 0, 0, 0);

            var navHtml = `
                <div class="admin-date-nav">
                    <div class="nav-group">
                        <button class="admin-nav-btn" onclick="changeMonth(-1)">◀</button>
                        <span class="month-label">${monthNames[baseDate.getMonth()]} ${baseDate.getFullYear()}</span>
                        <button class="admin-nav-btn" onclick="changeMonth(1)">▶</button>
                    </div>
                    <div class="nav-group">
                        <button class="admin-nav-btn today" onclick="goToToday()">📅 Сегодня</button>
                        <span style="color:rgba(255,255,255,0.3);font-size:0.7rem;">${days.length} дней</span>
                    </div>
                </div>
            `;

            var tableHtml =
                '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th style="min-width:80px;text-align:left;">Номер</th>';

            days.forEach(function(day) {
                var dayNum = day.getDate();
                var dayWeek = weekDays[day.getDay() === 0 ? 6 : day.getDay() - 1];
                var isWeekend = day.getDay() === 0 || day.getDay() === 6;
                var isToday = day.toDateString() === new Date().toDateString();
                var isPast = day < today;
                tableHtml += '<th class="date-col ' + (isToday ? 'today' : '') + ' ' + (isWeekend ? 'weekend' : '') +
                    ' ' + (isPast ? 'past-date' : '') + '"><span class="day-week">' + dayWeek +
                    '</span><span class="day-num">' + dayNum + '</span></th>';
            });

            tableHtml += '</tr></thead><tbody>';

            ROOMS.forEach(function(room) {
                tableHtml += '<tr class="room-row"><td><span class="room-label">' + rName(room) +
                    '</span><span class="room-cap">всего: ' + room.total + '</span></td>';
                days.forEach(function(day) {
                    var dateStr = day.toISOString().split('T')[0];
                    var total = room.total;
                    var available = getAvail(room.id, dateStr);
                    var realFree = realAvail(room.id, dateStr);
                    var isPast = day < today;
                    var statusClass = 'free';
                    if (isPast) statusClass = 'past';
                    else if (realFree <= 0) statusClass = 'busy';
                    else if (realFree <= 2) statusClass = 'low';
                    var isToday = day.toDateString() === new Date().toDateString();

                    var inputDisabled = isPast ? ' disabled' : '';

                    tableHtml += '<td class="date-col ' + (isToday ? 'today' : '') + ' ' + (isPast ? 'past-date' :
                        '') + '"><input type="number" value="' + available + '" min="0" max="' + total +
                        '" ' + inputDisabled + ' onchange="setAvail(\'' + room.id + '\',\'' + dateStr +
                        '\',+this.value)" onblur="renderAdmin()"><span class="avail-indicator ' +
                        statusClass + '">' + (isPast ? '🔒' : realFree) + '/' + total + '</span></td>';
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table></div>';

            var legendHtml = `
                <div class="legend">
                    <span><span class="dot free"></span> Свободно (≥3)</span>
                    <span><span class="dot low"></span> 1-2 места</span>
                    <span><span class="dot busy"></span> Занято</span>
                    <span><span class="dot past"></span> Прошедшие даты 🔒</span>
                    <span style="color:rgba(255,255,255,0.3);">🟡 Сегодня</span>
                </div>
            `;

            container.innerHTML = navHtml + tableHtml + legendHtml;
        }

        function changeMonth(delta) {
            adminDateOffset += delta;
            renderAdmin();
        }

        function goToToday() {
            adminDateOffset = 0;
            renderAdmin();
        }

        // ===== ЗАКРЫТИЕ ПРОШЕДШИХ ДАТ =====
        function closePastDates() {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var todayStr = today.toISOString().split('T')[0];
            var closedCount = 0;

            for (var rid in avails) {
                if (avails.hasOwnProperty(rid)) {
                    for (var dateStr in avails[rid]) {
                        if (avails[rid].hasOwnProperty(dateStr)) {
                            var dateParts = dateStr.split('-');
                            var dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                            if (dateObj < today) {
                                if (avails[rid][dateStr] > 0) {
                                    avails[rid][dateStr] = 0;
                                    closedCount++;
                                }
                            }
                        }
                    }
                }
            }

            if (closedCount > 0) {
                showToast('🔒 Закрыто ' + closedCount + ' прошедших дат', 'info');
                setStatus('🔒 Закрыто ' + closedCount + ' прошедших дат (до ' + todayStr + ')', 'warning');
            } else {
                showToast('✅ Все прошедшие даты уже закрыты', 'success');
                setStatus('✅ Все прошедшие даты уже закрыты', 'success');
            }

            saveToCloud();
            renderAdmin();
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        (async function() {
            await loadFromCloud();
            renderAdmin();

            setInterval(saveToCloud, 300000);
            window.addEventListener('beforeunload', function() { saveToCloud(); });
        })();
    </script>
