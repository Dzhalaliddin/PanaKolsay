            align-items: center;
            gap: 4px;

        .legend .dot {

            width: 10px;
            height: 10px;

        .legend .dot.low {

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 99999;
            background: #f5c542;
            color: #1a2a27;

        }

        }
        @keyframes slideUp {
            from {

            }

    </style>
</head>
<body>

        // ============ ОБЛАКО ============
        async function loadFromCloud() {
            try {
                // Сначала загружаем из localStorage (быстро)
                var localData = localStorage.getItem('pkb_backup');
                if (localData) {
                    try {
                        var parsed = JSON.parse(localData);
                        if (parsed.avails && Object.keys(parsed.avails).length > 0) {
                            avails = parsed.avails || {};
                            bookings = parsed.bookings || [];
                            console.log('✅ Загружено из localStorage');
                        }
                    } catch(e) {}
                }

                // Потом обновляем из облака
                try {
                    var r = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                    if (r.ok) {
                        var j = await r.json();
                        if (j.record && j.record.avails) {
                            avails = j.record.avails || {};
                            bookings = j.record.bookings || [];
                            localStorage.setItem('pkb_backup', JSON.stringify({ avails: avails, bookings: bookings }));
                            console.log('✅ Обновлено из облака');
                            return true;
                        }
                    }
                } catch (e) {
                    console.warn('⚠️ Облако недоступно, использую localStorage');
                }

                // Если облако не ответило и localStorage пустой
                if (!avails || Object.keys(avails).length === 0) {
                    avails = {};
                    bookings = [];
                    console.log('ℹ️ Данные не найдены');
                }
                return true;
            } catch (e) {
                console.warn('⚠️ Ошибка загрузки:', e);
                avails = {};
                bookings = [];
                return false;
            }
        }

        async function saveToCloud() {
            try {
                var d = { avails: avails, bookings: bookings, ts: new Date().toISOString() };
                var response = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(d)
                });
                if (response.ok) {
                    localStorage.setItem('pkb_backup', JSON.stringify(d));
                    showToast('✅ Сохранено в облако!');
                    return true;
                } else {
                    throw new Error('Ошибка сохранения');
                }
            } catch (e) {
                console.warn('⚠️ Ошибка сохранения в облако, сохранено локально:', e);
                var d = { avails: avails, bookings: bookings, ts: new Date().toISOString() };
                localStorage.setItem('pkb_backup', JSON.stringify(d));
                showToast('⚠️ Сохранено локально (облако недоступно)', 'info');
                return false;
            }
        }

        async function saveAllData() {
            await saveToCloud();

        function getAvail(rid, date) {
            if (avails[rid] && avails[rid][date] !== undefined) return avails[rid][date];
            var room = ROOMS.find(function(r) { return r.id === rid; });
            return room ? room.total : 0;
        }

        function setAvail(rid, date, n) {
            if (!avails[rid]) avails[rid] = {};
            var room = ROOMS.find(function(r) { return r.id === rid; });
            var max = room ? room.total : 0;
            avails[rid][date] = Math.max(0, Math.min(n, max));
        }

        function bookedCount(rid, date) {
            var count = 0;
            for (var i = 0; i < bookings.length; i++) {
                var b = bookings[i];
                var rids = b.rid ? b.rid.split(',') : [];
                if (rids.indexOf(rid) !== -1 && b.date === date && b.st === 'ok') {
                    count++;
                }
            }
            return count;
        }

        function realAvail(rid, date) {
            return Math.max(0, getAvail(rid, date) - bookedCount(rid, date));
        }

        function handleBookingsFile(file) {

                    var workbook = XLSX.read(data, { type: 'array' });
                    var sheet = workbook.Sheets[workbook.SheetNames[0]];
                    uploadedBookingsData = XLSX.utils.sheet_to_json(sheet);
                    var headers = Object.keys(uploadedBookingsData[0] || {});
                    console.log('📋 Найдены колонки:', headers.join(', '));

                        .length + ' записей)';

                    processExcelFiles();

                }

        // ===== ОСНОВНАЯ ФУНКЦИЯ ОБРАБОТКИ EXCEL =====
        async function processExcelFiles() {
            if (!uploadedBookingsData) {
                setStatus('❌ Сначала загрузите bookings.xlsx', 'error');
                return;
            }

            setProgress('Начинаем обработку...', 10);

            try {
                var headers = Object.keys(uploadedBookingsData[0] || {});
                console.log('📋 Все колонки:', headers);

                var typeCol = null;
                var checkInCol = null;
                var checkOutCol = null;

                var possibleTypeCols = ['Категория номера', 'категория', 'Тип номера', 'тип', 'Room', 'Категория'];
                for (var i = 0; i < headers.length; i++) {
                    for (var j = 0; j < possibleTypeCols.length; j++) {
                        if (headers[i].toLowerCase().indexOf(possibleTypeCols[j].toLowerCase()) !== -1) {
                            typeCol = headers[i];
                            break;
                        }
                    }
                    if (typeCol) break;
                }

                var possibleCheckInCols = ['Заезд', 'заезд', 'Check-in', 'check-in', 'Дата заезда'];
                for (var i = 0; i < headers.length; i++) {
                    for (var j = 0; j < possibleCheckInCols.length; j++) {
                        if (headers[i].toLowerCase().indexOf(possibleCheckInCols[j].toLowerCase()) !== -1) {
                            checkInCol = headers[i];
                            break;
                        }
                    }
                    if (checkInCol) break;
                }

                var possibleCheckOutCols = ['Выезд', 'выезд', 'Check-out', 'check-out', 'Дата выезда'];
                for (var i = 0; i < headers.length; i++) {
                    for (var j = 0; j < possibleCheckOutCols.length; j++) {
                        if (headers[i].toLowerCase().indexOf(possibleCheckOutCols[j].toLowerCase()) !== -1) {
                            checkOutCol = headers[i];
                            break;
                        }
                    }
                    if (checkOutCol) break;
                }

                console.log('🔍 Найдено:', { typeCol: typeCol, checkInCol: checkInCol, checkOutCol: checkOutCol });

                if (!typeCol || !checkInCol || !checkOutCol) {
                    setStatus('❌ Не найдены колонки. Доступны: ' + headers.join(', '), 'error');
                    setProgress('Ошибка', 100);
                    return;
                }

                setProgress('Обработка броней...', 30);

                var allBookings = [];
                var unknownTypes = {};

                uploadedBookingsData.forEach(function(row) {
                    var rawTypes = String(row[typeCol] || '');
                    var types = rawTypes.split(/\n|\.\s*|\d+\./).map(function(s) { return s.trim(); }).filter(function(
                    s) { return s; });
                    if (types.length === 0 && rawTypes.trim()) {
                        types = [rawTypes.trim()];
                    }

                    var checkIn, checkOut;
                    var checkInRaw = row[checkInCol];
                    var checkOutRaw = row[checkOutCol];

                    if (typeof checkInRaw === 'number') {
                        checkIn = new Date((checkInRaw - 25569) * 86400 * 1000);
                    } else if (typeof checkInRaw === 'string') {
                        var dStr = checkInRaw.toString().trim();
                        var match = dStr.match(/(\d{4})-(\d{2})-(\d{2})/);
                        if (match) {
                            checkIn = new Date(match[1], match[2] - 1, match[3]);
                        } else {
                            match = dStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                            if (match) {
                                checkIn = new Date(match[3], match[1] - 1, match[2]);
                            } else {
                                checkIn = new Date(dStr);
                            }
                        }
                    } else if (checkInRaw instanceof Date) {
                        checkIn = new Date(checkInRaw);
                    } else {
                        checkIn = new Date(checkInRaw);
                    }

                    if (typeof checkOutRaw === 'number') {
                        checkOut = new Date((checkOutRaw - 25569) * 86400 * 1000);
                    } else if (typeof checkOutRaw === 'string') {
                        var dStr2 = checkOutRaw.toString().trim();
                        var match2 = dStr2.match(/(\d{4})-(\d{2})-(\d{2})/);
                        if (match2) {
                            checkOut = new Date(match2[1], match2[2] - 1, match2[3]);
                        } else {
                            match2 = dStr2.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                            if (match2) {
                                checkOut = new Date(match2[3], match2[1] - 1, match2[2]);
                            } else {
                                checkOut = new Date(dStr2);
                            }
                        }
                    } else if (checkOutRaw instanceof Date) {
                        checkOut = new Date(checkOutRaw);
                    } else {
                        checkOut = new Date(checkOutRaw);
                    }

                    if (isNaN(checkIn.getTime()) || isNaN(checkOut.getTime())) {
                        console.log('⚠️ Ошибка парсинга дат:', checkInRaw, checkOutRaw);
                        return;
                    }

                    checkIn = new Date(checkIn.getFullYear(), checkIn.getMonth(), checkIn.getDate());
                    checkOut = new Date(checkOut.getFullYear(), checkOut.getMonth(), checkOut.getDate());

                    if (checkOut <= checkIn) {
                        console.log('⚠️ Даты некорректны (выезд <= заезд):', checkIn, checkOut);
                        return;
                    }

                    types.forEach(function(type) {
                        if (type && type.length > 1) {
                            var typeLower = type.trim().toLowerCase();
                            var roomId = ROOM_TYPE_MAPPING_RAW[typeLower];
                            if (roomId) {
                                allBookings.push({
                                    type: type.trim(),
                                    checkIn: new Date(checkIn),
                                    checkOut: new Date(checkOut),
                                    roomId: roomId
                                });
                            } else {
                                unknownTypes[type] = (unknownTypes[type] || 0) + 1;
                            }
                        }
                    });
                });

                var unknownKeys = Object.keys(unknownTypes);
                if (unknownKeys.length > 0) {
                    console.log('⚠️ Неизвестные типы номеров (пропущены):', unknownKeys);
                    setStatus('⚠️ Найдены неизвестные типы: ' + unknownKeys.join(', '), 'warning');
                }

                if (allBookings.length === 0) {
                    setStatus('❌ Не найдено ни одной корректной брони.', 'error');
                    setProgress('Ошибка', 100);
                    return;
                }

                console.log('✅ Найдено броней:', allBookings.length);
                setProgress('Обработано ' + allBookings.length + ' броней...', 50);

                var minDate = new Date(Math.min.apply(null, allBookings.map(function(b) { return b.checkIn.getTime(); })));
                var maxDate = new Date(Math.max.apply(null, allBookings.map(function(b) { return b.checkOut.getTime(); })));
                var startDate = new Date(minDate);
                var endDate = new Date(maxDate);
                endDate.setDate(endDate.getDate() + 1);

                var totalDays = Math.min(Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)), 365);
                if (totalDays > 365) {
                    endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + 365);
                }

                var newAvails = {};
                var today = new Date();
                today.setHours(0, 0, 0, 0);

                ROOMS.forEach(function(room) {
                    newAvails[room.id] = {};
                });

                var d = new Date(startDate);
                var daysProcessed = 0;
                var totalDaysToProcess = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));

                while (d < endDate) {
                    var dateStr = d.toISOString().split('T')[0];
                    daysProcessed++;

                    ROOMS.forEach(function(room) {
                        var total = room.total;
                        var busy = 0;
                        allBookings.forEach(function(b) {
                            if (b.roomId === room.id) {
                                if (d >= b.checkIn && d < b.checkOut) {
                                    busy++;
                                }
                            }
                        });
                        var free = Math.max(0, total - busy);
                        if (d < today) {
                            newAvails[room.id][dateStr] = 0;
                        } else {
                            newAvails[room.id][dateStr] = Math.min(free, total);
                        }
                    });

                    if (daysProcessed % 10 === 0) {
                        var progress = 70 + (daysProcessed / totalDaysToProcess) * 25;
                        setProgress('Обработка дат... ' + daysProcessed + '/' + totalDaysToProcess, Math.min(95,
                        progress));
                    }

                    d.setDate(d.getDate() + 1);
                }

                avails = newAvails;

                setProgress('Сохранение...', 95);
                await saveToCloud();

                setProgress('Готово!', 100);
                setStatus('✅ Доступность обновлена! Обработано ' + allBookings.length + ' броней, ' + totalDaysToProcess +
                    ' дней. Прошедшие даты закрыты.', 'success');
                showToast('✅ Доступность успешно обновлена из Excel!', 'success');

                setTimeout(function() {
                    document.getElementById('adminProgress').classList.remove('show');
                    setProgress('', 0);
                    switchTab('availability');
                }, 1500);

            } catch (err) {
                setStatus('❌ Ошибка: ' + err.message, 'error');
                setProgress('Ошибка', 100);
                console.error(err);
            }
        }

        function closePastDates() {
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var closedCount = 0;

            for (var rid in avails) {
                if (avails.hasOwnProperty(rid)) {
                    for (var dateStr in avails[rid]) {
                        if (avails[rid].hasOwnProperty(dateStr)) {
                            var dateParts = dateStr.split('-');
                            var dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                            if (dateObj < today) {
                                if (avails[rid][dateStr] > 0) {
                                    avails[rid][dateStr] = 0;
                                    closedCount++;
                                }
                            }
                        }
                    }
                }
            }

            if (closedCount > 0) {
                showToast('🔒 Закрыто ' + closedCount + ' прошедших дат', 'info');
                setStatus('🔒 Закрыто ' + closedCount + ' прошедших дат', 'warning');

                    var realFree = Math.max(0, available - booked);
                    var isPast = day < today;
                    var statusClass = 'free';
                    if (isPast) statusClass = 'past';
                    else if (realFree <= 0) statusClass = 'busy';
                    else if (realFree <= 2) statusClass = 'low';
                    var isToday = day.toDateString() === new Date().toDateString();

                    var inputDisabled = isPast ? ' disabled' : '';

                    tableHtml += '<td class="date-col ' + (isToday ? 'today' : '') + ' ' + (isPast ? 'past-date' :
                        '') + '"><input type="number" value="' + available + '" min="0" max="' + total +
                        '" ' + inputDisabled + ' onchange="setAvail(\'' + room.id + '\',\'' + dateStr +
                        '\',+this.value)" onblur="renderAdmin()"><span class="avail-indicator ' +
                        statusClass + '">' + (isPast ? '🔒' : realFree) + '/' + total + '</span></td>';
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table></div>';

            var legendHtml = `
                <div class="legend">
                    <span><span class="dot free"></span> Свободно (≥3)</span>
                    <span><span class="dot low"></span> 1-2 места</span>
                    <span><span class="dot busy"></span> Занято</span>
                    <span><span class="dot past"></span> Прошедшие даты 🔒</span>
                    <span style="color:rgba(255,255,255,0.3);">🟡 Сегодня</span>
                </div>
            `;

            container.innerHTML = navHtml + tableHtml + legendHtml;
        }

        function changeMonth(delta) {
            adminDateOffset += delta;
            renderAdmin();
        }

        function goToToday() {
            adminDateOffset = 0;
            renderAdmin();
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        // Если пользователь уже был залогинен — показываем админку
        // Иначе — страница входа
        console.log('🔐 Админ-панель загружена');

        // Проверяем, есть ли сохраненная сессия
        var savedSession = localStorage.getItem('pana_admin_session');
        if (savedSession === 'true') {
            // Пробуем войти автоматически
            document.getElementById('passwordInput').value = ADMIN_PASSWORD;
            login();
        }

        // Обработчик для кнопки "Войти" по Enter
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // При загрузке страницы показываем лоадер
        document.getElementById('loginLoading').textContent = '⏳ Подготовка...';

        console.log('✅ Админ-панель готова');
    </script>

</body>
</html>
