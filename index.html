        }

        .bg::after {
            content: '';

            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            pointer-events: none;
        }

        body {

            min-height: 100vh;
        }

            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 28px 24px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* === ШАПКА === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .logo h1 span {
            font-weight: 700;
            color: #f5c542;
        }

        /* === ЯЗЫКИ === */
        .lang-switch {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .lang-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .lang-btn.active {
            background: #f5c542;
            color: #1e2c2a;
        }

        .subtitle {

            color: rgba(255, 255, 255, 0.75);
            font-size: 1rem;
            margin-bottom: 28px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

            margin-bottom: 32px;

            gap: 8px;

            font-weight: 600;
            font-size: 0.95rem;

            border: none;
            cursor: pointer;

            color: #fff;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.25);
        }

        // === ФУНКЦИЯ ОБНОВЛЕНИЯ ===
        function renderLanguage(lang) {
            const t = data[lang];
            if (!t) return;

            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('whatsappBtn').textContent = t.whatsapp;
            document.getElementById('instagramBtn').textContent = t.instagram;
            document.getElementById('phoneBtn').textContent = t.phone;
            document.getElementById('bookBtn').textContent = t.book;

            const grid = document.getElementById('roomsGrid');
            grid.innerHTML = '';

            t.rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'card';

                let featuresHtml = '';
                room.features.forEach(f => {
                    featuresHtml += `<li>${f}</li>`;
                });

                card.innerHTML = `
                    <h2>${room.name}</h2>
                    <div class="price">${room.price}</div>
                    <div class="desc">${room.desc}</div>
                    <ul class="features">${featuresHtml}</ul>
                    <a class="view-link" href="${room.link}" target="_blank">${room.view}</a>
                `;

                grid.appendChild(card);
            });
        }

        // === ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ===
        const langBtns = document.querySelectorAll('.lang-btn');

        langBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                langBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderLanguage(this.dataset.lang);
            });
        });

        // === СТАРТ: РУССКИЙ ===
        renderLanguage('ru');
    </script>
